name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app functions tests

      - name: Validate SAM template structure
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('template.yaml').read_text())"

      - name: Run tests
        run: pytest -q
