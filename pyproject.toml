[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loanlens-backend"
version = "0.1.0"
description = "LoanLens backend for deterministic loan offer document analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "boto3>=1.35.0",
  "pytest>=8.3.2",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
