AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LoanLens backend MVP (deterministic, PRD-bounded)

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 512
    Environment:
      Variables:
        APP_ENV: production
        LOANLENS_AWS_REGION: ap-south-1
        S3_INPUT_BUCKET: !Ref LoanLensUploadBucket
        DYNAMODB_RULES_TABLE: !Ref LoanLensRulesTable
        DYNAMODB_DLA_TABLE: !Ref LoanLensDlaSnapshotTable
        DYNAMODB_LOGS_TABLE: !Ref LoanLensInteractionLogsTable
        USE_FAKE_TEXTRACT: 'false'

Resources:
  LoanLensApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  LoanLensUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter7Days
            Status: Enabled
            ExpirationInDays: 7

  LoanLensRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rule_id
          AttributeType: S
      KeySchema:
        - AttributeName: rule_id
          KeyType: HASH

  LoanLensDlaSnapshotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: snapshot_date
          AttributeType: S
        - AttributeName: canonical_name
          AttributeType: S
      KeySchema:
        - AttributeName: snapshot_date
          KeyType: HASH
        - AttributeName: canonical_name
          KeyType: RANGE

  LoanLensInteractionLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: interaction_id
          AttributeType: S
      KeySchema:
        - AttributeName: interaction_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  LoanLensHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.health_handler.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /health
            Method: get
            RestApiId: !Ref LoanLensApi

  LoanLensMockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.loanlens_mock_handler.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /loanlens/mock
            Method: get
            RestApiId: !Ref LoanLensApi

  LoanLensProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.loanlens_process_handler.lambda_handler
      # Scoped here (not in Globals) on purpose — putting this in Globals
      # would make every function, including the escalation-draft Lambda,
      # reference the state machine, which references the escalation-draft
      # Lambda back → circular dependency, sam deploy fails.
      Environment:
        Variables:
          ESCALATION_STATE_MACHINE_ARN: !Ref LoanLensEscalationStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt LoanLensDlaSnapshotTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt LoanLensInteractionLogsTable.Arn
            - Effect: Allow
              Action:
                - states:StartSyncExecution
              Resource: !Ref LoanLensEscalationStateMachine
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /loanlens/process
            Method: post
            RestApiId: !Ref LoanLensApi

  LoanLensExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.extraction_handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
              Resource: '*'
      Events:
        UploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref LoanLensUploadBucket
            Events: s3:ObjectCreated:*

  LoanLensEscalationDraftFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: functions.escalation_draft_handler.lambda_handler

  LoanLensEscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: EXPRESS
      Definition:
        StartAt: RouteDraft
        States:
          RouteDraft:
            Type: Choice
            Choices:
              - Variable: $.draft_type
                StringEquals: grievance_officer
                Next: GrievanceDraft
            Default: SachetDraft
          GrievanceDraft:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt LoanLensEscalationDraftFunction.Arn
              Payload.$: $
            OutputPath: $.Payload
            End: true
          SachetDraft:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt LoanLensEscalationDraftFunction.Arn
              Payload.$: $
            OutputPath: $.Payload
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref LoanLensEscalationDraftFunction

Outputs:
  LoanLensApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${LoanLensApi}.execute-api.ap-south-1.amazonaws.com/prod/"
  UploadBucketName:
    Value: !Ref LoanLensUploadBucket
